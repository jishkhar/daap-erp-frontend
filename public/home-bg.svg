<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6f1"/>
      <stop offset="0.45" stop-color="#fbf6f1"/>
      <stop offset="1" stop-color="#eef2ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ece2"/>
      <stop offset="1" stop-color="#fbf6f1"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect y="800" width="1536" height="224" fill="url(#floor)"/>

  <g transform="translate(370 203) scale(0.75)">
  <!-- window -->
  <rect x="900" y="60" width="520" height="700" fill="url(#light)" stroke="#cbd7c7" stroke-width="10"/>
  <g stroke="#cbd7c7" stroke-width="8">
    <line x1="1160" y1="60" x2="1160" y2="760"/>
    <line x1="900" y1="400" x2="1420" y2="400"/>
  </g>

  <!-- pendant lamp -->
  <line x1="760" y1="0" x2="760" y2="110" stroke="#a6b8a1" stroke-width="4"/>
  <path d="M708 190 Q760 100 812 190 Z" fill="#a6b8a1" fill-opacity="0.55"/>
  <ellipse cx="760" cy="196" rx="34" ry="8" fill="#e3eae0"/>

  <!-- shelving unit with stock -->
  <g>
    <rect x="520" y="330" width="360" height="470" rx="6" fill="#d9e2d5" fill-opacity="0.7" stroke="#a6b8a1" stroke-width="6"/>
    <g stroke="#a6b8a1" stroke-width="6">
      <line x1="520" y1="486" x2="880" y2="486"/>
      <line x1="520" y1="642" x2="880" y2="642"/>
    </g>
    <!-- top shelf boxes -->
    <rect x="548" y="396" width="70" height="90" rx="4" fill="#7f9579" fill-opacity="0.6"/>
    <rect x="628" y="420" width="58" height="66" rx="4" fill="#cbd7c7"/>
    <rect x="696" y="380" width="80" height="106" rx="4" fill="#a6b8a1" fill-opacity="0.8"/>
    <rect x="786" y="410" width="68" height="76" rx="4" fill="#e3eae0"/>
    <!-- middle shelf -->
    <rect x="548" y="552" width="90" height="90" rx="4" fill="#cbd7c7"/>
    <rect x="648" y="530" width="62" height="112" rx="4" fill="#7f9579" fill-opacity="0.55"/>
    <rect x="720" y="568" width="74" height="74" rx="4" fill="#e3eae0"/>
    <rect x="804" y="540" width="52" height="102" rx="4" fill="#a6b8a1" fill-opacity="0.8"/>
    <!-- bottom shelf -->
    <rect x="548" y="702" width="120" height="98" rx="4" fill="#a6b8a1" fill-opacity="0.8"/>
    <rect x="678" y="722" width="80" height="78" rx="4" fill="#cbd7c7"/>
    <rect x="768" y="700" width="88" height="100" rx="4" fill="#e3eae0"/>
  </g>

  <!-- counter with POS tablet and parcels -->
  <rect x="1000" y="610" width="400" height="190" rx="10" fill="#d9e2d5" stroke="#a6b8a1" stroke-width="6"/>
  <rect x="990" y="590" width="420" height="30" rx="8" fill="#a6b8a1" fill-opacity="0.75"/>
  <rect x="1060" y="500" width="120" height="84" rx="8" fill="#5f7459" fill-opacity="0.7"/>
  <rect x="1070" y="510" width="100" height="62" rx="4" fill="#e3eae0"/>
  <rect x="1100" y="584" width="40" height="6" fill="#5f7459" fill-opacity="0.7"/>
  <rect x="1240" y="520" width="100" height="70" rx="5" fill="#cbd7c7" stroke="#a6b8a1" stroke-width="4"/>
  <rect x="1262" y="470" width="76" height="50" rx="5" fill="#e3eae0" stroke="#a6b8a1" stroke-width="4"/>
  <line x1="1290" y1="520" x2="1290" y2="590" stroke="#a6b8a1" stroke-width="4"/>

  <!-- plant -->
  <path d="M1470 800 L1490 800 L1500 720 L1460 720 Z" fill="#a6b8a1" fill-opacity="0.8"/>
  <g fill="#7f9579" fill-opacity="0.55">
    <path d="M1480 720 Q1420 640 1440 540 Q1490 600 1480 720 Z"/>
    <path d="M1480 720 Q1540 630 1520 520 Q1470 600 1480 720 Z"/>
    <path d="M1480 720 Q1480 600 1500 470 Q1530 600 1480 720 Z"/>
  </g>

  <!-- floor shadows -->
  <ellipse cx="700" cy="812" rx="220" ry="14" fill="#a6b8a1" fill-opacity="0.22"/>
  <ellipse cx="1200" cy="812" rx="240" ry="14" fill="#a6b8a1" fill-opacity="0.22"/>
  </g>
</svg>
