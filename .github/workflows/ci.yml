name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request (a newer push cancels the older run). Runs on main are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # CI only verifies; run `npm run format` (or ./build.sh) locally to fix.
      - name: Format check (prettier --check)
        run: npm run format:check

      - name: Build (next build)
        run: npm run build
